name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Actiepagina testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Playwright-versie bepalen
        id: pw
        run: echo "versie=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Chromium uit cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.versie }}

      - name: Chromium downloaden (bij cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Systeemafhankelijkheden installeren
        run: npx playwright install-deps chromium

      - name: Tests uitvoeren
        run: npm test

      - name: Rapport publiceren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
