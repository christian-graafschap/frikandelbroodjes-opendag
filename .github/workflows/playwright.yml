name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Actiepagina testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Playwright-browsers installeren
        run: npx playwright install --with-deps chromium

      - name: Tests uitvoeren
        run: npm test

      - name: Rapport publiceren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
