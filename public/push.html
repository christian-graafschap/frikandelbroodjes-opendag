<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Committen en pushen</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7e0;color:#2b2b2b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.kaart{background:#fff;border-radius:16px;padding:28px;max-width:480px;width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:1.4rem}
p{margin:0 0 16px;color:#4a4a4a}
label{display:block;font-size:.9rem;font-weight:600;color:#4a4a4a;margin-bottom:6px}
input[type=text]{width:100%;border:1px solid #d3dae2;border-radius:10px;padding:10px 12px;font:inherit;background:#f5f7f9}
.knoppen{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.primair{background:#15803d;color:#fff}
.primair:hover:not(:disabled){background:#166534}
.sec{background:#eef2f6;color:#1b2430}
.status{margin-top:16px;min-height:1.4em;font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.status.ok{color:#15803d}
.status.fout{color:#b91c1c}
</style>
</head>
<body>
<div class="kaart">
  <h1>Committen en pushen</h1>
  <p>De huidige actiepagina wordt opgeslagen in <code>public/config.json</code>, en alle lokale wijzigingen worden gecommit en gepusht naar GitHub.</p>
  <label for="bericht">Commitbericht (optioneel)</label>
  <input id="bericht" type="text" maxlength="200" placeholder="Bijv.: prijs aangepast voor de open dag">
  <div class="knoppen">
    <button type="button" class="primair" id="push">Nu committen en pushen</button>
    <button type="button" class="sec" onclick="location.href='/'">Terug naar de pagina</button>
  </div>
  <div class="status" id="status" role="status"></div>
</div>
<script>
const knop = document.getElementById("push");
const st = document.getElementById("status");
knop.addEventListener("click", async () => {
  const bericht = document.getElementById("bericht").value.trim();
  st.className = "status"; st.textContent = "Bezig…"; knop.disabled = true;
  try {
    const r = await fetch("/api/push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bericht })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.fout || r.status);
    st.className = "status ok"; st.textContent = data.bericht || "Klaar.";
  } catch (e) {
    st.className = "status fout"; st.textContent = "Mislukt: " + e.message;
  } finally {
    knop.disabled = false;
  }
});
</script>
</body>
</html>
