<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina resetten</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7e0;color:#2b2b2b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.kaart{background:#fff;border-radius:16px;padding:28px;max-width:420px;width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
h1{margin:0 0 8px;font-size:1.4rem}
p{margin:0 0 20px;color:#4a4a4a}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer;margin:4px}
.gevaar{background:#e11d48;color:#fff}
.gevaar:hover{background:#be123c}
.sec{background:#eef2f6;color:#1b2430}
.status{margin-top:16px;min-height:1.4em;font-size:.95rem}
.status.ok{color:#15803d}
.status.fout{color:#b91c1c}
</style>
</head>
<body>
<div class="kaart">
  <h1>Pagina resetten</h1>
  <p>Hiermee gaat de actiepagina terug naar de standaardinstellingen. Alle wijzigingen van bezoekers worden gewist.</p>
  <button type="button" class="gevaar" id="reset">Ja, reset nu</button>
  <button type="button" class="sec" onclick="location.href='/'">Terug naar de pagina</button>
  <div class="status" id="status" role="status"></div>
</div>
<script>
document.getElementById("reset").addEventListener("click", async () => {
  const st = document.getElementById("status");
  st.className = "status"; st.textContent = "Bezig…";
  try {
    const r = await fetch("/api/reset", { method: "POST" });
    if (!r.ok) throw new Error(r.status);
    st.className = "status ok"; st.textContent = "Teruggezet naar de standaardinstellingen.";
    // Een open testrapport laat dan weer het standaardrapport zien.
    if ("BroadcastChannel" in window) new BroadcastChannel("testrapport").postMessage("nieuw-rapport");
  } catch (e) {
    st.className = "status fout"; st.textContent = "Reset mislukt: " + e.message;
  }
});
</script>
</body>
</html>
